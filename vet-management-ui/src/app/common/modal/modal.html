@if (open()) {
    <div class="modal d-block">
      <div class="modal-dialog" [class.modal-lg]="large()">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">{{ title() }}</h5>
            <button type="button" class="btn-close" (click)="onCancel()"></button>
          </div>
          <div class="modal-body">
            <ng-content />
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" (click)="onCancel()">{{ cancelText() }}</button>
            <button type="button" class="btn" [disabled]="isLoading()" [class]="affirmButtonClass()" (click)="onAffirm()">
              @if (isLoading()) {
                <span class="spinner-border spinner-border-sm me-2"></span>
              }
              {{ affirmText() }}
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-backdrop show"></div>
}
