<app-page-layout title="Products">
    <p class="text-muted mb-5">Manage billable items offered by the clinic.</p>
    @if (isLoading) {
        <app-loading-spinner message="Loading products..." />
    }

    @if (!isLoading) {
        <div class="d-grid gap-5 ms-4">
            <div class="card product-card p-1 w-25 rounded-1" (click)="viewMedications()">
                <div class="card-body d-grid gap-2 text-secondary">
                    <span><i class="bi bi-capsule me-2"></i>Medications</span>
                    <span>Inventory Management</span>
                    <span><span class="text-danger">{{ medicationCount }}</span> medications</span>
                </div>
            </div>
            
            <div class="card product-card p-1 w-25 rounded-1" (click)="viewServices()">
                <div class="card-body d-grid gap-2 text-secondary">
                    <span><i class="bi bi-bag-plus me-2"></i>Services</span>
                    <span><span class="text-primary">{{ serviceCount }}</span> services</span>
                </div>
            </div>
        </div>
    }
</app-page-layout>
