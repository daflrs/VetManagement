<app-page-layout title="Medications" subtitle="Create Medication" [backButton]="true">
    <div class="py-4 w-50">
        <form [formGroup]="form" (ngSubmit)="submit()">
        
            <div class="input-group mb-3">
                <label class="input-group-text">
                    Name
                    <span class="text-danger ms-1">*</span>
                </label>
                <input class="form-control" formControlName="name" />
            </div>
            
            <div class="input-group mb-3">
                <label class="input-group-text">
                    Price
                    <span class="text-danger ms-1">*</span>
                </label>
                <input class="form-control" type="number" formControlName="price" />
            </div>
            
            <div class="input-group mb-3">
                <label class="input-group-text">
                    Stock
                    <span class="text-danger ms-1">*</span>
                </label>
                <input class="form-control" type="number" formControlName="availableCount" />
            </div>
            
            <div class="input-group mb-3">
                <label class="input-group-text">
                    Manufacturer
                </label>
                <input class="form-control" formControlName="manufacturer" />
            </div>
            
            <div class="input-group mb-3">
                <label class="input-group-text">
                    Expiration Date
                </label>
                <input class="form-control" type="date" formControlName="expirationDate" />
            </div>

            <button type="submit" class="btn btn-primary" [disabled]="loading">Create Medication</button>
        </form>
    </div>
</app-page-layout>
